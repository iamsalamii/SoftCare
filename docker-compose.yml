version: '3.8'

services:
  # 1. Base de données PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: softcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: softcare_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - softcare-network

  # 2. Interface d'administration PostgreSQL (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: softcare-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@softcare.fr
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - softcare-network

  # 3. Backend API ASP.NET Core 9
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: softcare-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=softcare_db;Username=postgres;Password=postgrespassword
      - Jwt__Secret=SoftCareSecureMedicalHospitalKey2026!#SuperSecretKeyWithSufficientLengthForHS256SecurityStandard
      - Database__UseInMemory=false
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - softcare-network

  # 4. Frontend React 18 / Nginx
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softcare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - softcare-network

volumes:
  postgres_data:
    driver: local

networks:
  softcare-network:
    driver: bridge
