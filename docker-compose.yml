version: '3.8'

services:
  # 1. Base de données PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: softcare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-softcare_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - softcare-network

  # 2. Interface d'administration PostgreSQL (pgAdmin 4)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: softcare-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@softcare.fr}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-adminpassword}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - softcare-network

  # 3. Backend API ASP.NET Core 9
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: softcare-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-softcare_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgrespassword}
      - Jwt__Secret=${JWT_SECRET:-SoftCareSecureMedicalHospitalKey2026!#SuperSecretKeyWithSufficientLengthForHS256SecurityStandard}
      - Database__UseInMemory=false
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - softcare-network
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.softcare-api.entrypoints=https"
      - "traefik.http.routers.softcare-api.rule=Host(`api.2.28.63.25.sslip.io`)"
      - "traefik.http.routers.softcare-api.tls=true"
      - "traefik.http.routers.softcare-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.softcare-api.loadbalancer.server.port=5000"
      - "traefik.http.routers.softcare-api-http.entrypoints=http"
      - "traefik.http.routers.softcare-api-http.rule=Host(`api.2.28.63.25.sslip.io`)"

  # 4. Frontend React 18 / Nginx (optionnel si hébergé sur Vercel)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: softcare-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - softcare-network

volumes:
  postgres_data:
    driver: local

networks:
  softcare-network:
    driver: bridge
  coolify:
    external: true
