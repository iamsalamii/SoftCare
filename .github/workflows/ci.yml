name: SoftCare CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: 🧪 .NET 9 Build & xUnit Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup .NET 9.0 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: 📦 Restore Dependencies
      run: dotnet restore backend/SoftCare.Backend.sln

    - name: 🔨 Build Solution
      run: dotnet build backend/SoftCare.Backend.sln --no-restore --configuration Release

    - name: 🚀 Run xUnit Unit Tests
      run: dotnet test backend/tests/SoftCare.UnitTests/SoftCare.UnitTests.csproj --no-build --configuration Release --verbosity normal

  frontend-build:
    name: 🌐 React Frontend Build & Type Check
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: ⚙️ Setup Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🔨 Build Production Bundle
      run: npm run build

  docker-build:
    name: 🐳 Docker Multi-Stage Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    steps:
    - name: 📥 Checkout Repository
      uses: actions/checkout@v4

    - name: 🐳 Set up Docker Buildx
      uses: actions/setup-buildx-action@v3

    - name: 🔨 Build Backend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: backend/Dockerfile
        push: false
        tags: softcare-backend:test

    - name: 🔨 Build Frontend Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: Dockerfile
        push: false
        tags: softcare-frontend:test
